<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayı Tahmin Oyunu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }
    input {
      font-size: 20px;
      padding: 10px;
      width: 120px;
      border-radius: 8px;
      border: none;
      text-align: center;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }
    #sonuc {
      font-size: 22px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Sayı Tahmin Oyunu</h1>
  <p>1 ile 100 arasında bir sayı tuttum. Bil bakalım!</p>

  <input type="number" id="tahmin">
  <button onclick="kontrolEt()">Tahmin Et</button>

  <p id="sonuc"></p>
  <p id="sayac">Tahmin sayısı: 0</p>
  <button onclick="yeniOyun()">Yeni Oyun</button>

  <script>
    let gizliSayi = Math.floor(Math.random() * 100) + 1;
    let tahminSayisi = 0;

    function kontrolEt() {
      let tahmin = Number(document.getElementById("tahmin").value);
      let sonuc = document.getElementById("sonuc");

      tahminSayisi = tahminSayisi + 1;
      document.getElementById("sayac").innerText = "Tahmin sayısı: " + tahminSayisi;

      if (tahmin === gizliSayi) {
        sonuc.innerText = "Tebrikler, " + tahminSayisi + " tahminde bildin! 🎉";
      } else if (tahmin < gizliSayi) {
        sonuc.innerText = "Daha büyük bir sayı dene.";
      } else {
        sonuc.innerText = "Daha küçük bir sayı dene.";
      }
    }

    function yeniOyun() {
      gizliSayi = Math.floor(Math.random() * 100) + 1;
      tahminSayisi = 0;
      document.getElementById("sonuc").innerText = "";
      document.getElementById("sayac").innerText = "Tahmin sayısı: 0";
      document.getElementById("tahmin").value = "";
    }
  </script>
</body>
</html>
